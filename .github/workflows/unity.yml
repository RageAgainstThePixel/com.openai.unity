name: Unity
on:
  schedule:
    - cron: '0 8 18 * *' # monthly: the older editors, which no longer change
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: ['**']
  workflow_dispatch: # manual workflow trigger
    inputs:
      editors:
        description: Which editors to test
        type: choice
        options: [unity-6-and-newer, legacy]
        default: unity-6-and-newer
concurrency:
  # the monthly legacy run gets its own group, so a push to main does not cancel it
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'legacy' || inputs.editors || 'unity-6-and-newer' }}
  cancel-in-progress: ${{(github.event_name == 'pull_request' || github.event.action == 'synchronize')}}
jobs:
  setup:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
    # pull requests and pushes test the streams Unity lists; the older editors run monthly or on demand
    uses: RageAgainstThePixel/workflows/.github/workflows/unity-stream-matrix.yml@main
    with:
      legacy: ${{ inputs.editors == 'legacy' }}
      job-name-prefix: Build
  validate:
    if: ${{ needs.setup.outputs.jobs }}
    needs: setup
    name: ${{ matrix.jobs.name }}
    permissions:
      contents: read
      actions: write
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.jobs) }}
      fail-fast: false
      max-parallel: 1
    secrets: inherit
    uses: RageAgainstThePixel/workflows/.github/workflows/build-unity-package.yml@main
    with:
      matrix: ${{ toJSON(matrix.jobs.matrix) }}
      allow-security-alert: ${{ needs.setup.outputs.allow-security-alert == 'true' }}
